<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ChispaChat">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>ChispaChat</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-180.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mensajes · v12</p>
          <h1>ChispaChat</h1>
        </div>
        <button id="openGalleryButton" class="icon-button" type="button" aria-label="Abrir galería local" title="Galería local">
          <span aria-hidden="true">▦</span>
        </button>
      </header>

      <main>
        <section id="privacyNotice" class="privacy-notice" aria-label="Aviso de privacidad">
          <p>ChispaChat funciona solo en este dispositivo. No se sube nada a internet.</p>
          <button id="dismissNoticeButton" type="button">Entendido</button>
        </section>

        <section class="status-panel" aria-live="polite">
          <video id="cameraPreview" class="camera-preview" playsinline muted autoplay aria-hidden="true"></video>
          <canvas id="photoCanvas" hidden></canvas>
          <p id="statusMessage">v12 · Chats actualizados</p>
        </section>

        <section id="zoomStories" class="zoom-stories" aria-label="Controles de zoom de cámara" hidden>
          <button class="story-zoom" type="button" data-zoom="0.5" aria-label="Cambiar a cámara amplia">
            <span>
              <img src="./icons/story-luna.svg" alt="">
            </span>
          </button>
          <button class="story-zoom active" type="button" data-zoom="1" aria-label="Cambiar a cámara normal">
            <span>
              <img src="./icons/story-nico.svg" alt="">
            </span>
          </button>
          <button class="story-zoom" type="button" data-zoom="2" aria-label="Cambiar a zoom medio">
            <span>
              <img src="./icons/story-mara.svg" alt="">
            </span>
          </button>
          <button class="story-zoom" type="button" data-zoom="5" aria-label="Cambiar a zoom largo">
            <span>
              <img src="./icons/story-teo.svg" alt="">
            </span>
          </button>
        </section>

        <section class="chat-list" aria-label="Lista de conversaciones">
          <button class="chat-row action-row" id="photoChat" type="button">
            <img class="avatar avatar-image" src="./icons/story-luna.svg" alt="" aria-hidden="true">
            <span class="chat-copy">
              <span class="chat-title">Alicia compipiso</span>
              <span class="chat-last" id="photoLastMessage">te mando algo ahora</span>
            </span>
            <span class="chat-meta" id="photoMeta">ahora</span>
          </button>

          <button class="chat-row action-row" id="videoChat" type="button">
            <img class="avatar avatar-image" src="./icons/story-mara.svg" alt="" aria-hidden="true">
            <span class="chat-copy">
              <span class="chat-title">Mamá móvil</span>
              <span class="chat-last" id="videoLastMessage">nota pendiente</span>
            </span>
            <span class="chat-meta" id="videoMeta">local</span>
          </button>

          <button class="chat-row static-chat-row" type="button" data-chat-id="portal">
            <img class="avatar avatar-image" src="./icons/story-nico.svg" alt="" aria-hidden="true">
            <span class="chat-copy">
              <span class="chat-title">Grupo del portal</span>
              <span class="chat-last">Luego os cuento bien</span>
            </span>
            <span class="chat-meta">12:10</span>
          </button>

          <button class="chat-row static-chat-row" type="button" data-chat-id="plan">
            <img class="avatar avatar-image" src="./icons/story-teo.svg" alt="" aria-hidden="true">
            <span class="chat-copy">
              <span class="chat-title">Plan improvisado</span>
              <span class="chat-last">¿Quedamos en diez?</span>
            </span>
            <span class="chat-meta">ayer</span>
          </button>

          <button class="chat-row static-chat-row" type="button" data-chat-id="soporte">
            <img class="avatar avatar-image" src="./icons/story-luna.svg" alt="" aria-hidden="true">
            <span class="chat-copy">
              <span class="chat-title">Soporte Premium</span>
              <span class="chat-last">Quedamos atentos a su confirmación</span>
            </span>
            <span class="chat-meta">lun.</span>
          </button>

          <button class="chat-row static-chat-row" type="button" data-chat-id="oficina">
            <img class="avatar avatar-image" src="./icons/story-mara.svg" alt="" aria-hidden="true">
            <span class="chat-copy">
              <span class="chat-title">Oficina Central</span>
              <span class="chat-last">Adjuntamos el resumen revisado</span>
            </span>
            <span class="chat-meta">dom.</span>
          </button>

          <button class="chat-row static-chat-row" type="button" data-chat-id="vecina">
            <img class="avatar avatar-image" src="./icons/story-luna.svg" alt="" aria-hidden="true">
            <span class="chat-copy">
              <span class="chat-title">Vecina 3B</span>
              <span class="chat-last">Muchísimas gracias por avisar</span>
            </span>
            <span class="chat-meta">sáb.</span>
          </button>

          <button class="chat-row static-chat-row" type="button" data-chat-id="banco">
            <img class="avatar avatar-image" src="./icons/story-teo.svg" alt="" aria-hidden="true">
            <span class="chat-copy">
              <span class="chat-title">Gestoría Banco</span>
              <span class="chat-last">La documentación queda recibida</span>
            </span>
            <span class="chat-meta">vie.</span>
          </button>
        </section>
      </main>
    </div>

    <dialog id="galleryDialog" class="gallery-dialog">
      <form method="dialog" class="dialog-header">
        <div>
          <p class="eyebrow">Solo en este dispositivo</p>
          <h2>Galería local</h2>
        </div>
        <button class="icon-button" value="close" aria-label="Cerrar galería" title="Cerrar" type="submit">
          <span aria-hidden="true">×</span>
        </button>
      </form>

      <div class="gallery-actions">
        <button id="refreshGalleryButton" type="button">Actualizar</button>
        <button id="clearGalleryButton" class="danger" type="button">Borrar todo</button>
      </div>

      <div id="galleryEmpty" class="empty-state">Todavía no hay elementos en este chat.</div>
      <div id="galleryList" class="gallery-list" aria-live="polite"></div>
    </dialog>

    <dialog id="chatDialog" class="chat-dialog">
      <video id="chatCameraAnchor" class="camera-preview" playsinline muted autoplay aria-hidden="true"></video>
      <form method="dialog" class="chat-dialog-header">
        <button class="back-button" value="close" aria-label="Volver a conversaciones" title="Volver" type="submit">
          <span aria-hidden="true">‹</span>
        </button>
        <span id="chatDialogAvatar" class="avatar avatar-muted" aria-hidden="true">C</span>
        <div class="chat-dialog-copy">
          <h2 id="chatDialogTitle">Conversación</h2>
          <p id="chatDialogSubtitle">en línea</p>
          <span id="chatRecordingIndicator" class="chat-recording-indicator" hidden><i></i><b id="chatRecordingLabel">en curso</b></span>
        </div>
      </form>
      <div id="chatMessages" class="message-thread" aria-live="polite"></div>
      <form id="chatComposer" class="chat-composer" autocomplete="off">
        <input id="chatInput" type="text" inputmode="text" placeholder="Mensaje" aria-label="Escribir mensaje">
        <button id="fakeAudioButton" class="audio-button" type="button" aria-label="Simular nota de audio" title="Audio">
          <span class="audio-icon" aria-hidden="true">●</span>
          <span id="fakeAudioTime" class="audio-time" hidden>00:00</span>
        </button>
        <button class="send-button" type="submit" aria-label="Enviar mensaje" title="Enviar">
          <span aria-hidden="true">↑</span>
        </button>
      </form>
    </dialog>

    <script src="./app.js" defer></script>
  </body>
</html>
